<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>产品详情 - 柯妮尔 KENIER</title>
<meta name="description" content="柯妮尔（KENIER）产品详情：商务纸巾、抽纸、卷纸、大盘纸源头工厂。">
<style>
:root{
  --primary:#0d47a1;--primary-dark:#0a3578;--accent:#ff8f00;--bg:#f7f9fc;
  --dark:#1a2332;--text:#333a45;--muted:#7a8598;--radius:12px;--shadow:0 6px 24px rgba(13,71,161,.10);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;color:var(--text);background:#fff;line-height:1.7}
a{text-decoration:none;color:inherit}
.container{width:min(1200px,92%);margin:0 auto}
.topbar{background:var(--dark);color:#cfd8e3;font-size:13px;padding:7px 0}
.topbar .container{display:flex;justify-content:space-between;align-items:center}
.topbar a{color:#ffd180}
.lang-switch button{background:none;border:1px solid #55606f;color:#cfd8e3;padding:2px 10px;border-radius:4px;cursor:pointer;font-size:12px;margin-left:6px}
.lang-switch button.active{background:var(--accent);border-color:var(--accent);color:#fff}
header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.97);box-shadow:0 2px 12px rgba(0,0,0,.06)}
.nav{display:flex;justify-content:space-between;align-items:center;padding:16px 0}
.logo{font-size:22px;font-weight:800;color:var(--primary)}
.logo span{color:var(--accent)}
.back-link{font-size:14px;color:var(--primary);font-weight:600}
.back-link:hover{color:var(--accent)}
.crumb{padding:18px 0;font-size:13px;color:var(--muted)}
.crumb a{color:var(--primary)}
.detail{display:grid;grid-template-columns:1fr 1fr;gap:44px;padding:10px 0 50px}
.gallery-main{border-radius:var(--radius);overflow:hidden;background:#f2f5fa;height:420px;display:flex;align-items:center;justify-content:center;font-size:110px;box-shadow:var(--shadow)}
.gallery-main img{width:100%;height:100%;object-fit:cover}
.thumbs{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap}
.thumb{width:76px;height:76px;border-radius:8px;overflow:hidden;border:2px solid #e3e9f2;cursor:pointer;background:#f2f5fa;display:flex;align-items:center;justify-content:center;font-size:32px;transition:.2s}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb.active,.thumb:hover{border-color:var(--accent)}
.info h1{font-size:clamp(22px,3vw,32px);color:var(--dark);margin-bottom:12px}
.info .short{color:var(--muted);margin-bottom:20px}
.price-box{background:#fff7ee;border:1px solid #ffe0b3;border-radius:10px;padding:16px 20px;margin-bottom:20px}
.price-box .p{font-size:26px;font-weight:800;color:var(--accent)}
.price-box .m{font-size:13px;color:var(--muted);margin-top:2px}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px;font-size:14px}
.meta div{background:var(--bg);border-radius:8px;padding:10px 14px}
.meta span{color:var(--muted);display:block;font-size:12px}
.meta strong{color:var(--dark)}
.btn{display:inline-block;background:var(--primary);color:#fff;padding:13px 32px;border-radius:8px;font-weight:600;transition:.25s}
.btn:hover{background:var(--primary-dark)}
.btn-accent{background:var(--accent)}
.btn-accent:hover{background:#e67c00}
.contact-line{margin-top:18px;font-size:14px;color:var(--muted)}
.contact-line a{color:var(--primary);font-weight:600}
.detail-text{background:var(--bg);border-radius:var(--radius);padding:34px;margin-bottom:60px}
.detail-text h2{font-size:20px;color:var(--dark);margin-bottom:16px;padding-left:12px;border-left:4px solid var(--accent)}
.detail-text p{white-space:pre-line;color:var(--text)}
.notfound{text-align:center;padding:100px 0;color:var(--muted)}
footer{background:var(--dark);color:#aebacd;padding:28px 0;text-align:center;font-size:13px}
@media(max-width:860px){.detail{grid-template-columns:1fr}.gallery-main{height:300px}}
</style>
</head>
<body>
<div class="topbar"><div class="container">
  <div>📦 支持 OEM 贴牌定制 · 源头工厂直供 <a href="mailto:violetvernon17@gmail.com">获取报价 →</a></div>
  <div class="lang-switch">
    <button onclick="setLang('zh',this)">中文</button>
    <button onclick="setLang('en',this)">English</button>
  </div>
</div></div>
<header><div class="container nav">
  <a class="logo" href="/">柯妮尔<span> KENIER</span></a>
  <a class="back-link" href="/">← <span data-zh="返回产品列表" data-en="Back to Products">返回产品列表</span></a>
</div></header>

<div class="container">
  <div class="crumb"><a href="/" data-zh="首页" data-en="Home">首页</a> / <span data-zh="产品详情" data-en="Product Details">产品详情</span></div>
  <div id="app"><div class="notfound">Loading...</div></div>
  <div id="detailText" class="detail-text" style="display:none">
    <h2 data-zh="产品详情" data-en="Product Details">产品详情</h2>
    <p id="detailPara"></p>
  </div>
</div>
<footer>© 2026 柯妮尔 KENIER · <span data-zh="保留所有权利" data-en="All Rights Reserved">保留所有权利</span></footer>

<script>
let currentLang = localStorage.getItem('site-lang') || 'zh';
let product = null, gallery = [];

function nl2br(s){ return (s||'').replace(/\n/g,'<br>'); }
function setLang(lang, btn){
  currentLang = lang; localStorage.setItem('site-lang', lang);
  document.querySelectorAll('.lang-switch button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('[data-zh]').forEach(el=>{ if(el.dataset[lang]) el.innerHTML = el.dataset[lang]; });
  if(product) render();
}
document.querySelectorAll('.lang-switch button').forEach(b=>b.classList.toggle('active', (b.textContent.trim()==='English') === (currentLang==='en')));

async function init(){
  const id = new URLSearchParams(location.search).get('id');
  let items = [];
  try{
    const r = await fetch('https://kenier-api.violetvernon17.workers.dev/api/data');
    if(r.ok){ const d = await r.json(); if(d && d.items && d.items.length) items = d.items; }
  }catch(e){}
  if(!items.length){
    try{
      const res = await fetch('/data/products.json');
      const data = await res.json();
      items = data.items || [];
    }catch(e){}
  }
  product = items.find(p=>String(p.id)===String(id)) || items[Number(id)] || null;
  if(!product){
    document.getElementById('app').innerHTML = '<div class="notfound">产品不存在或已下架<br><br><a class="btn" href="/">返回首页</a></div>';
    return;
  }
  gallery = (product.images && product.images.length) ? product.images : (product.image ? [product.image] : []);
  document.title = (currentLang==='en'?(product.en||product.zh):product.zh) + ' - 柯妮尔 KENIER';
  render();
}

function render(){
  const name = currentLang==='en' ? (product.en||product.zh) : product.zh;
  const short = currentLang==='en' ? (product.enDesc||product.zhDesc) : product.zhDesc;
  const detail = currentLang==='en' ? (product.detailEn||product.detailZh||'') : (product.detailZh||'');
  const mainImg = gallery.length ? `<img id="mainImg" src="${gallery[0]}" alt="${name}">` : `<div>${product.icon||'📦'}</div>`;
  const thumbs = gallery.map((g,i)=>`<div class="thumb${i===0?' active':''}" onclick="swapImg(${i},this)"><img src="${g}" alt=""></div>`).join('');
  const mailBody = encodeURIComponent((currentLang==='en'?'Hello, I am interested in: ':'您好，我对以下产品感兴趣：') + name + (currentLang==='en'?'\nPlease send me a quotation.':'\n请提供报价，谢谢。'));

  document.getElementById('app').innerHTML = `
  <div class="detail">
    <div>
      <div class="gallery-main" id="galleryMain">${mainImg}</div>
      ${gallery.length>1 ? `<div class="thumbs">${thumbs}</div>` : ''}
    </div>
    <div class="info">
      <h1>${name}</h1>
      <p class="short">${short}</p>
      <div class="price-box">
        <div class="p">${product.price}</div>
        <div class="m">${product.moq}</div>
      </div>
      <div class="meta">
        <div><span data-zh="品牌" data-en="Brand">品牌</span><strong>KENIER / OEM</strong></div>
        <div><span data-zh="供货能力" data-en="Supply Capacity">供货能力</span><strong data-zh="现货 + 定制生产" data-en="Stock + Custom Production">现货 + 定制生产</strong></div>
        <div><span data-zh="样品" data-en="Sample">样品</span><strong data-zh="支持寄样" data-en="Samples Available">支持寄样</strong></div>
        <div><span data-zh="付款方式" data-en="Payment">付款方式</span><strong data-zh="T/T、对公转账" data-en="T/T, Bank Transfer">T/T、对公转账</strong></div>
      </div>
      <a class="btn btn-accent" href="mailto:violetvernon17@gmail.com?subject=${encodeURIComponent('询价：'+name)}&body=${mailBody}"><span data-zh="立即询价" data-en="Inquire Now">立即询价</span></a>
      <p class="contact-line">
        📧 <a href="mailto:violetvernon17@gmail.com">violetvernon17@gmail.com</a><br>
        💬 <span data-zh="微信" data-en="WeChat">微信</span>: P3h1Sev
      </p>
    </div>
  </div>`;
  document.title = name + ' - 柯妮尔 KENIER';

  const dt = document.getElementById('detailText');
  if(detail){ dt.style.display='block'; document.getElementById('detailPara').innerHTML = nl2br(detail); }
  else dt.style.display='none';
}

function swapImg(i, el){
  document.getElementById('mainImg').src = gallery[i];
  document.querySelectorAll('.thumb').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
}
init();
</script>
</body>
</html>
