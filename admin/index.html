<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>柯妮尔网站后台</title>
<script>
/* OAuth 回调处理：把令牌直接写入 Decap 的本地存储，绕开地址栏解析 */
(function () {
  var h = window.location.hash || '';
  var m = h.match(/access_token=([^&]+)/);
  if (m && h.indexOf('provider=github') !== -1) {
    var user = JSON.stringify({ token: m[1], provider: 'github' });
    try {
      localStorage.setItem('decap-cms-user', user);
      localStorage.setItem('netlify-cms-user', user);
    } catch (e) {}
    // 清掉 hash，让 Decap 干净启动
    history.replaceState(null, '', window.location.pathname);
  }
})();
</script>
</head>
<body>
<script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
