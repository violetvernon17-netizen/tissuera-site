backend:
  name: github
  repo: violetvernon17/tissuera-site
  branch: main
  base_url: https://kenier-oauth.violetvernon17.workers.dev

media_folder: "images/uploads"
public_folder: "/images/uploads"
locale: "zh_Hans"

collections:
  - name: "site"
    label: "🏠 首页文案与联系方式"
    files:
      - name: "site"
        label: "首页标语 / 邮箱 / 微信 / 地址"
        file: "data/site.json"
        fields:
          - {label: "首页主标题（中文）", name: "heroTitleZh", widget: "string"}
          - {label: "首页主标题（英文）", name: "heroTitleEn", widget: "string", required: false}
          - {label: "首页副标题（中文）", name: "heroDescZh", widget: "text"}
          - {label: "首页副标题（英文）", name: "heroDescEn", widget: "text", required: false}
          - {label: "商务邮箱", name: "email", widget: "string"}
          - {label: "微信号", name: "wechat", widget: "string"}
          - {label: "公司地址（中文）", name: "addressZh", widget: "string"}
          - {label: "公司地址（英文）", name: "addressEn", widget: "string", required: false}

  - name: "categories"
    label: "🗂 分类管理"
    folder: "data/categories"
    create: true
    delete: true
    identifier_field: "name"
    extension: "json"
    format: "json"
    fields:
      - {label: "分类名称（中文）", name: "name", widget: "string"}
      - {label: "分类英文名称（选填）", name: "nameEn", widget: "string", required: false}

  - name: "products"
    label: "📦 产品管理"
    files:
      - name: "products"
        label: "产品列表（可增删改）"
        file: "data/products.json"
        fields:
          - label: "产品列表"
            name: "items"
            widget: "list"
            summary: "{{fields.zh}}"
            fields:
              - label: "产品分类（下拉选择，没有想要的分类请先到「🗂 分类管理」新建）"
                name: "category"
                widget: "relation"
                collection: "categories"
                value_field: "name"
                display_fields: ["name"]
                search_fields: ["name"]
                required: false
              - {label: "产品ID（英文小写+连字符，创建后勿改，如 box-tissue）", name: "id", widget: "string"}
              - {label: "图标（emoji，无图片时显示）", name: "icon", widget: "string", required: false}
              - label: "产品图片（可传多张，第一张为封面）"
                name: "images"
                widget: "list"
                required: false
                field: {label: 图片, name: image, widget: image}
              - {label: "产品名称（中文）", name: "zh", widget: "string"}
              - {label: "产品名称（英文）", name: "en", widget: "string", required: false}
              - {label: "产品描述（中文）", name: "zhDesc", widget: "text"}
              - {label: "产品描述（英文）", name: "enDesc", widget: "text", required: false}
              - {label: "详细介绍（中文，详情页显示，每行一条）", name: "detailZh", widget: "text", required: false}
              - {label: "详细介绍（英文）", name: "detailEn", widget: "text", required: false}
              - {label: "起订量（如 MOQ 5000 盒起）", name: "moq", widget: "string"}
              - {label: "价格区间（如 ¥0.8 - 2.5）", name: "price", widget: "string"}
